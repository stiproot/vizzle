# Build wheels for every supported platform and publish them to PyPI.
#
# Triggered by a `v*` tag. Publishing uses PyPI Trusted Publishing (OIDC), so
# there is no API token stored in this repository — PyPI verifies GitHub
# directly. The publisher registered on PyPI names this file, so renaming it
# breaks publishing until the pending publisher is updated to match.
#
# See docs/distribution.md §5 and §6.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The maturin project root: the pyproject.toml lives here and reaches back to
  # crates/vizzle-py via manifest-path (docs/distribution.md §4).
  PROJECT_DIR: packages/vizzle-cli

jobs:
  # The version is stated once, in the root Cargo.toml. A tag that disagrees
  # with it would publish the wrong number under the right name, so fail loudly
  # and early rather than after the matrix has burned twenty minutes.
  check-version:
    name: Tag matches Cargo version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cargo
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo workspace version: $version"
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          cargo="${{ steps.cargo.outputs.version }}"
          if [ "$tag" != "$cargo" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $cargo"
            exit 1
          fi
          echo "tag v$tag matches Cargo.toml"

  build:
    name: "wheel: ${{ matrix.name }}"
    needs: check-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28, not `auto`. `auto` selects manylinux2014 (glibc
          # 2.17), where tree-sitter's endian shim compiles but produces an
          # `undefined symbol: le16toh` at import: it asks for _DEFAULT_SOURCE,
          # a macro glibc did not gain until 2.19. glibc 2.28 is a 2018 floor.
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { name: macos-arm64, runner: macos-14, target: aarch64-apple-darwin }
          # Cross-compiled on Apple Silicon: GitHub has retired the Intel macOS
          # runners, and a macos-13 job queues forever rather than failing. The
          # macOS toolchain targets both architectures, so this costs nothing —
          # but it is the one wheel the smoke job below cannot run.
          - { name: macos-x86_64, runner: macos-14, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # abi3-py310 means ONE wheel per platform covers every Python from 3.10
      # up, so this never needs --find-interpreter (docs/distribution.md §5).
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: ${{ env.PROJECT_DIR }}
          args: --release --out dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.name }}
          path: ${{ env.PROJECT_DIR }}/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          working-directory: ${{ env.PROJECT_DIR }}
          args: --out dist

      # manifest-path reaches outside the project directory, so the sdist has to
      # carry crates/ and the workspace manifest or it cannot build. Verify that
      # here rather than discovering it from a user's failed `pip install`.
      - name: sdist carries the Rust workspace
        run: |
          tarball=$(ls ${{ env.PROJECT_DIR }}/dist/*.tar.gz)
          echo "checking $tarball"
          for required in Cargo.toml crates/vizzle-core/src/lib.rs crates/vizzle-py/src/lib.rs; do
            if ! tar tzf "$tarball" | sed 's#^[^/]*/##' | grep -qx "$required"; then
              echo "::error::sdist is missing $required — it would not build"
              exit 1
            fi
            echo "  ok: $required"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-sdist
          path: ${{ env.PROJECT_DIR }}/dist/*.tar.gz
          if-no-files-found: error

  # Install each wheel on a clean runner and actually run it. Importing the
  # extension is the load-bearing part: a wheel can build cleanly and still
  # fail at import with an undefined symbol, which is how the manylinux2014
  # wheels shipped broken. Every architecture we publish gets exercised here —
  # except macos-x86_64, which has no runner (see the build matrix).
  smoke:
    name: "smoke: ${{ matrix.name }}"
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-14 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist
      - name: Install the wheel and render this repo
        shell: bash
        run: |
          set -x
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          # Import first and on its own: an undefined symbol surfaces here, and
          # a bare traceback from `vizzle --version` is harder to read.
          python -c "from vizzle_cli import _core; print('extension ok:', _core.__version__)"
          vizzle --version
          vizzle component . -o components.mmd
          vizzle class . -o classes.html
      # Assert on content, not just on the file existing: an empty render and a
      # successful one both produce a file, and only one of them is a release.
      - name: The output is a real diagram
        shell: bash
        run: |
          grep -q '^flowchart' components.mmd || { echo "::error::no flowchart in components.mmd"; cat components.mmd; exit 1; }
          grep -q '<svg' classes.html || { echo "::error::no svg in classes.html"; exit 1; }
          grep -q 'd3' classes.html || { echo "::error::d3 was not inlined — the page is not self-contained"; exit 1; }
          echo "components.mmd $(wc -c < components.mmd) bytes, classes.html $(wc -c < classes.html) bytes"

  publish:
    name: Publish to PyPI
    needs: [build, sdist, smoke]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing; no API token needed.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
