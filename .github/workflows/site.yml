name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/**"
      - "crates/**"
      - "packages/**"
      - "docs/diagrams/**"
      - ".github/workflows/site.yml"
  # The same build on pull requests, minus the deploy, so a site change is checked
  # before it merges rather than first failing on main.
  pull_request:
    paths:
      - "site/**"
      - "examples/**"
      - "crates/**"
      - "packages/**"
      - "docs/diagrams/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Build vizzle from this checkout so the self diagrams are generated by
      # the commit being deployed, never a stale extension or a PyPI wheel.
      # --reinstall-package is mandatory: a cached editable build can be loaded
      # by an older interpreter and fails with an unexpected-keyword error.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Build vizzle from the checkout
        run: uv sync --reinstall-package vizzle

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./site
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ./site
        run: bun run lint

      - name: Type check
        working-directory: ./site
        run: bun run type-check

      - name: Build
        working-directory: ./site
        run: bun run build

      - name: Deploy to Firebase Hosting
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: ./site
          channelId: live
