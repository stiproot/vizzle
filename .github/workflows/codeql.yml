# Static analysis for the languages CodeQL supports here. It does not cover
# Rust, which is most of vizzle — `cargo clippy -D warnings` in ci.yml and
# `cargo audit` below are what stand in for that. `pip-audit` covers the lock
# file on the Python side.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land after code does; a weekly run catches what was clean when
    # it merged and is not any more.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: "codeql: ${{ matrix.language }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # to upload results
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  # Dependabot covers Cargo.toml, but an advisory against a transitive crate in
  # Cargo.lock is the more likely shape of the problem for a Rust dependency tree.
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The action reports findings as a check run, which the workflow-wide
      # `contents: read` does not allow. Without this it finds the advisories
      # and then fails on the report rather than on the finding.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The same check for the Python side: uv.lock pins every transitive Python
  # dependency, and an advisory against one of them is invisible to Dependabot's
  # version bumps until the next bump happens to cross it.
  pip-audit:
    name: pip audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # --no-emit-workspace keeps the editable vizzle package out of the list:
      # it is not on PyPI's advisory database, and pip-audit refuses unhashed
      # editable requirements. --disable-pip audits the lock as written rather
      # than resolving it again in a scratch environment.
      - run: uv export --format requirements-txt --all-groups --no-emit-workspace -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --no-deps --disable-pip
