# Static analysis for the languages CodeQL supports here. It does not cover
# Rust, which is most of vizzle — `cargo clippy -D warnings` in ci.yml and
# `cargo audit` below are what stand in for that.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land after code does; a weekly run catches what was clean when
    # it merged and is not any more.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: "codeql: ${{ matrix.language }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # to upload results
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3

  # Dependabot covers Cargo.toml, but an advisory against a transitive crate in
  # Cargo.lock is the more likely shape of the problem for a Rust dependency tree.
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
