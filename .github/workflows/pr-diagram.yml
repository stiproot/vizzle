# Post a component diagram of what a pull request did to the shape of the
# application, as a comment on the PR. GitHub renders ```mermaid blocks
# natively, so this needs no image hosting and no external service.
#
# This is docs/distribution.md §2.3 — the rung that reaches readers who will
# never install anything. Copy it into any repo that has Python or TypeScript
# in it; the only requirement is `uvx` on the runner.
#
# SECURITY: this runs on `pull_request`, deliberately NOT `pull_request_target`.
# pull_request_target would run with a write token while checking out the PR's
# code, which is the pwn-request pattern — a PR could rewrite this workflow's
# own steps and exfiltrate the token. The cost of doing it the safe way is that
# fork PRs get a read-only token and cannot be commented on; see the job guard
# below, and the note at the bottom of this file for the pattern that fixes it.
name: pr-diagram

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: "Base revision to diff against (for trying this out without a PR)"
        default: "HEAD~1"

permissions:
  contents: read

jobs:
  component-diff:
    name: Component diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork PRs get a read-only GITHUB_TOKEN, so the comment step would 403.
    # Skip rather than fail: a red X on someone's first contribution is a worse
    # outcome than a missing diagram.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # vizzle reads both revisions out of git, so it needs the history
          # between them, not just the tip.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Does vizzle see this repo at all?
        id: applicable
        run: |
          # vizzle parses Python and TypeScript, and drops components holding
          # neither. On a repo made of anything else there is nothing to draw,
          # and an empty diagram would read as a claim about the architecture.
          count=$(git ls-files | grep -cE '\.(py|ts|tsx|mts|cts)$' || true)
          echo "sources=$count" >> "$GITHUB_OUTPUT"
          echo "$count parseable source files"

      - name: Render the component diff
        if: steps.applicable.outputs.sources != '0'
        id: render
        env:
          BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.base || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Pin vizzle to the latest released version to prevent runtime changes
          # to published package behavior. The pin must be bumped whenever a new
          # release goes out; see the release checklist in CLAUDE.md. It cannot
          # be bumped on the release's own branch: the version does not exist
          # on PyPI until the tag is pushed.
          #
          # --focus --modules keep the comment readable on an application-scale
          # repo; --zoom writes the changed classes to their own diagram. No -E
          # test globs here: the default test exclusion ships with the next
          # release, and a hand-written copy would go stale the day the pin
          # moves. Until then tests are drawn.
          uvx 'vizzle==0.13.0' diff . --base "$BASE" --type component --focus --modules --zoom zoom.mmd -o diagram.mmd --stats stats.json
          uvx 'vizzle==0.13.0' diff . --base "$BASE" --type component -o diagram.html

          # The verdict comes from --stats, never from the diagram text. The
          # class names in the mermaid (diffAdded, ...) are a rendering choice
          # and have already changed once; a grep on them reads every PR as
          # "no structural change" the day they change again.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          stats = json.load(open("stats.json", encoding="utf-8"))
          print(f"changed={'true' if stats['changed'] else 'false'}")
          print(f"oversized={'true' if stats.get('oversized') else 'false'}")
          print(f"chars={stats['chars']}")
          # `zoom` and `tests` are absent from the stats of releases before
          # the pin catches up; .get() keeps those a 0, not a KeyError.
          zoom = stats.get("zoom") or {}
          print(f"zoom_oversized={'true' if zoom.get('oversized') else 'false'}")
          print(f"zoom_chars={zoom.get('chars', 0)}")
          print(f"zoom_classes={zoom.get('classes', 0)}")
          tests = stats.get("tests") or {}
          tests_changed = tests.get("added", 0) + tests.get("removed", 0) + tests.get("modified", 0)
          print(f"tests_changed={tests_changed}")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.applicable.outputs.sources != '0'
        with:
          name: component-diagram
          path: |
            diagram.html
            zoom.mmd
          if-no-files-found: error

      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && steps.applicable.outputs.sources != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHANGED: ${{ steps.render.outputs.changed }}
          OVERSIZED: ${{ steps.render.outputs.oversized }}
          CHARS: ${{ steps.render.outputs.chars }}
          ZOOM_OVERSIZED: ${{ steps.render.outputs.zoom_oversized }}
          ZOOM_CHARS: ${{ steps.render.outputs.zoom_chars }}
          ZOOM_CLASSES: ${{ steps.render.outputs.zoom_classes }}
          TESTS_CHANGED: ${{ steps.render.outputs.tests_changed }}
        with:
          script: |
            const fs = require('fs');
            // Hidden marker so each run edits its own comment instead of
            // adding one per push — a 12-commit PR should not have 12 diagrams.
            const MARKER = '<!-- vizzle-component-diff -->';

            // Unset or empty env arrives as '' or undefined; read both as 0
            // rather than letting NaN pick a branch silently.
            const count = name => parseInt(process.env[name] || '0', 10) || 0;
            const testsChanged = count('TESTS_CHANGED');
            const zoomClasses = count('ZOOM_CLASSES');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const head = `${MARKER}\n### What this changed\n\n`;

            let body;
            if (process.env.CHANGED !== 'true') {
              body = testsChanged > 0
                ? head + `Tests only — ${testsChanged} test file(s) changed, no component added, removed, rewired or modified.`
                : head + `No structural change — this pull request does not add, remove, or rewire any component.`;
            } else if (process.env.OVERSIZED === 'true') {
              // `oversized` is vizzle's judgement against mermaid's own layout
              // ceiling, which is lower than GitHub's comment cap.
              body = head +
                `The diagram is ${process.env.CHARS} characters, past what a comment can hold. ` +
                `Download the interactive version from [the workflow run](${run}).`;
            } else {
              body = head + '```mermaid\n' + fs.readFileSync('diagram.mmd', 'utf8') + '\n```\n\n';
              if (zoomClasses > 0) {
                body += '#### Zoom: the changed classes\n\n';
                body += process.env.ZOOM_OVERSIZED === 'true'
                  ? `The zoom diagram is ${process.env.ZOOM_CHARS} characters, past what a comment can hold. ` +
                    `Download it from [the workflow run](${run}).\n\n`
                  : '```mermaid\n' + fs.readFileSync('zoom.mmd', 'utf8') + '\n```\n\n';
              }
              body += `<sub>✚ added · ✖ removed · ✱ modified · an added or removed arrow means the application was rewired</sub>\n\n` +
                `<sub>The draggable version is attached to [the run](${run}).</sub>`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
# To cover fork PRs safely, split this in two: keep this workflow token-less
# and have it upload diagram.mmd as an artifact, then add a second workflow on
# `workflow_run` that downloads the artifact and posts the comment. The
# privileged half never checks out the PR's code, so there is nothing for a
# contributor to rewrite. Worth doing when the first outside PR arrives.
