<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
__VIZ_CORE_CSS__
/* Class view specifics: boxes carry member rows, so they read as UML. */
:root { --box-fill: #ececff; --box-stroke: #9370db; }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span class="stats" id="stats"></span>
  <input id="search" type="search" placeholder="filter classes / modules…">
  <button id="fit">Fit</button>
  <span class="legend" id="legend" hidden></span>
</header>
<svg id="canvas"></svg>
<div class="hint">scroll to zoom · drag background to pan · drag classes to arrange</div>

<script>__D3_JS__</script>
<script>__VIZ_CORE_JS__</script>
<script id="graph-data" type="application/json">__GRAPH_JSON__</script>
<script id="config-data" type="application/json">__CONFIG_JSON__</script>
<script>
"use strict";
const graph = JSON.parse(document.getElementById("graph-data").textContent);
const config = JSON.parse(document.getElementById("config-data").textContent);
const { classBoxLayout, drawClassBox, relationStyle, nodeTransform, linkPath } = vizzle;
const { draggableNodes, externalStub, buildLinks, gridCells, arrowMarker } = vizzle;

const DIFF = graph.stats.diff;

// ---- nodes -------------------------------------------------------------
const CHAR_W = vizzle.BOX.charWidth, PAD_X = vizzle.BOX.padX, HEADER_H = vizzle.BOX.headerH;

function buildNode(c) {
  const box = classBoxLayout(c, { showMembers: config.showMembers });
  return { id: c.qualified, cls: c, box, w: box.w, h: box.h, external: false };
}

// The graph always carries «module» boxes; the page shows them only when asked,
// so the page and the mermaid renderer agree (class.md §2.4).
const drawn = config.showModules
  ? graph.classes
  : graph.classes.filter((c) => c.annotation !== "module");
const nodes = drawn.map(buildNode);
const byId = new Map(nodes.map((n) => [n.id, n]));

// External bases become small stub nodes (deduped by name).
if (config.includeExternals) {
  for (const r of graph.relations) {
    if (!r.external || byId.has(`ext:${r.to}`)) continue;
    const stub = externalStub(r.to, { charWidth: CHAR_W, padX: PAD_X, payloadKey: "cls", height: HEADER_H });
    stub.box = classBoxLayout(stub.cls, { showMembers: false, showModule: false });
    stub.box.w = stub.w;
    stub.box.h = stub.h;
    nodes.push(stub);
    byId.set(stub.id, stub);
  }
}

const links = buildLinks(graph.relations, byId, config.includeExternals, (r) => ({ kind: r.kind }));

// ---- layout: force simulation, ticked synchronously -------------------
// Weak per-module gravity keeps each module's classes near a grid cell.
const modules = [...new Set(nodes.map((n) => n.cls.module))].sort();
const cellOf = gridCells(modules, 640);

nodes.forEach((n, i) => {
  const c = cellOf.get(n.cls.module) || { x: 0, y: 0 };
  n.x = c.x + (i % 7) * 30 - 90;
  n.y = c.y + (Math.floor(i / 7) % 7) * 30 - 90;
});

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => (l.source.h + l.target.h) / 2 + 90).strength(0.6))
  .force("charge", d3.forceManyBody().strength(-900).distanceMax(1200))
  .force("collide", d3.forceCollide().radius((d) => Math.hypot(d.w, d.h) / 2 + 26).strength(0.95))
  .force("x", d3.forceX((d) => (cellOf.get(d.cls.module) || { x: 0 }).x).strength(0.06))
  .force("y", d3.forceY((d) => (cellOf.get(d.cls.module) || { y: 0 }).y).strength(0.06))
  .stop();
for (let i = 0; i < 300; i++) sim.tick();

// ---- render ------------------------------------------------------------
const svg = d3.select("#canvas");
const view = svg.append("g");

svg.append("defs").html(
  arrowMarker("arrow-hollow", "var(--edge)", 8, "hollow") + arrowMarker("arrow-open", "var(--edge)", 7)
);

const edge = view.append("g")
  .selectAll("path")
  .data(links)
  .join("path")
  .attr("fill", "none")
  .attr("stroke", "var(--edge)")
  .attr("stroke-width", 1.1)
  .attr("opacity", (d) => (d.kind === "dependency" ? 0.55 : 0.85))
  .attr("stroke-dasharray", (d) => relationStyle(d.kind).dash)
  .attr("marker-end", (d) => `url(#arrow-${relationStyle(d.kind).marker})`);
edge.append("title").text((d) => `${d.source.cls.name} ${d.kind} ${d.target.cls.name}`);

const node = view.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .call(drawClass)
  .call((sel) => draggableNodes(sel, { onMove: updateEdges }));

function drawClass(sel) {
  sel.attr("transform", nodeTransform);
  sel.each(function (d) {
    drawClassBox(d3.select(this), d.cls, d.box, { diff: DIFF, external: d.external });
  });
}

function updateEdges() {
  edge.attr("d", linkPath);
}
updateEdges();

vizzle.attachViewport(svg, view, { fitButton: "fit" });

const matches = (n, query) => n.cls.qualified.toLowerCase().includes(query);
vizzle.attachFilter("search", { nodes: node, edges: edge, matches });

vizzle.setHeader(`${graph.stats.classes} classes · ${graph.stats.relations} relations`, DIFF);
</script>
</body>
</html>
