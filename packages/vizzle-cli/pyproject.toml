[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "vizzle"
description = "UML visualization for git: Mermaid class diagrams from code, with diff highlighting"
# The project's one README, at the repository root. Without this line PyPI
# shows "The author of this package has not provided a project description".
readme = "../../README.md"
# Derived from the Cargo workspace version by maturin, so the version is stated
# once for the whole project (docs/distribution.md §4).
dynamic = ["version"]
requires-python = ">=3.10"
license = "MIT"
# Without this entry maturin packages no licence file. The sdist and wheel
# would then declare a licence they do not carry.
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
    "watchfiles>=1.0",
]

[project.urls]
Homepage = "https://github.com/stiproot/vizzle"
Repository = "https://github.com/stiproot/vizzle"
Documentation = "https://github.com/stiproot/vizzle#readme"
Changelog = "https://github.com/stiproot/vizzle/releases"
Issues = "https://github.com/stiproot/vizzle/issues"

[project.scripts]
vizzle = "vizzle_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

# One distribution: the Rust extension and the Python CLI ship in the same wheel,
# so a user can never land on a mismatched pair (docs/distribution.md §4).
[tool.maturin]
module-name = "vizzle_cli._core"
manifest-path = "../../crates/vizzle-py/Cargo.toml"
python-source = "src"
