<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
__VIZ_CORE_CSS__
/* Component view specifics. */
.group-box { cursor: grab; }
.group-box:active { cursor: grabbing; }
.comp-toggle { cursor: pointer; }
.comp-toggle:hover circle { fill: #ddf4ff; stroke: #0969da; }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span class="stats" id="stats"></span>
  <input id="search" type="search" placeholder="filter components / groups…">
  <button id="fit">Fit</button>
  <button id="toggle-classes" aria-pressed="false">Show classes</button>
  <span class="legend" id="legend" hidden></span>
</header>
<svg id="canvas"></svg>
<div class="hint">scroll to zoom · drag a component or its group box · click ⊕ on a component to open its classes</div>

<script>__D3_JS__</script>
<script>__VIZ_CORE_JS__</script>
<script id="graph-data" type="application/json">__GRAPH_JSON__</script>
<script id="config-data" type="application/json">__CONFIG_JSON__</script>
<script>
"use strict";
const graph = JSON.parse(document.getElementById("graph-data").textContent);
const config = JSON.parse(document.getElementById("config-data").textContent);
const { colorsFor, inkFor, mark, nodeTransform, linkPath, edgePoint } = vizzy;
const { classBoxLayout, drawClassBox, relationStyle } = vizzy;
const { draggableNodes, externalStub, buildLinks, gridCells, arrowMarker } = vizzy;

const DIFF = graph.stats.diff;
const CHAR_W = 7.25, PAD_X = 14;
const HEAD_H = 58;                       // collapsed component height
const INNER_PAD = 14;                    // gap between the class diagram and its component box
const INNER_SCALE = 1;                   // class boxes render at full size; zoom does the rest

// ---- model ------------------------------------------------------------
// Classes arrive flat, tagged with their component; group them once.
const classesByComponent = new Map();
for (const cls of graph.classes || []) {
  if (!classesByComponent.has(cls.component)) classesByComponent.set(cls.component, []);
  classesByComponent.get(cls.component).push(cls);
}

// Relations between classes, kept per component so an exploded box can draw
// its own class diagram.
const relationsByComponent = new Map();
const componentOfClass = new Map(graph.classes.map((c) => [c.qualified, c.component]));
for (const relation of graph.classRelations || []) {
  const from = componentOfClass.get(relation.from);
  if (!from || from !== componentOfClass.get(relation.to)) continue;   // cross-component: drawn at component level
  if (!relationsByComponent.has(from)) relationsByComponent.set(from, []);
  relationsByComponent.get(from).push(relation);
}

function statsLine(c) {
  const parts = [];
  parts.push(c.classes ? `${c.classes} class${c.classes === 1 ? "" : "es"}` : `${c.files} file${c.files === 1 ? "" : "s"}`);
  if (c.langs.length) {
    parts.push(c.langs.map((l) => ({ typescript: "ts", python: "py" })[l] || l).join("/"));
  }
  return parts.join(" · ");
}

function buildNode(c) {
  const classes = classesByComponent.get(c.path) || [];
  const header = c.name + mark(c.change);
  const sub = statsLine(c);
  const widest = Math.max(header.length + 2, sub.length, "«component»".length);
  const w = Math.min(340, widest * CHAR_W + PAD_X * 2);
  return { id: c.path, comp: c, sub, classes, expanded: false, w, h: HEAD_H, baseW: w, external: false };
}

const nodes = graph.components.map(buildNode);
const byId = new Map(nodes.map((n) => [n.id, n]));

if (config.includeExternals) {
  for (const e of graph.edges) {
    if (!e.external || byId.has(`ext:${e.to}`)) continue;
    const stub = externalStub(e.to, { charWidth: CHAR_W, padX: PAD_X, payloadKey: "comp" });
    Object.assign(stub, { sub: "", classes: [], expanded: false });
    nodes.push(stub);
    byId.set(stub.id, stub);
  }
}

const links = buildLinks(graph.edges, byId, config.includeExternals, (e) => ({
  weight: e.weight,
  change: e.change,
}));

// A component's "explosion": the class diagram that lives inside it. Laid out
// once at load — a small force pass over its own classes and relations — then
// only shown or hidden, never rebuilt.
function buildExplosion(node) {
  if (!node.classes.length) return null;
  const boxes = node.classes.map((cls) => {
    const box = classBoxLayout(cls, { showMembers: true, showModule: false, scale: INNER_SCALE });
    return { id: cls.qualified, cls, box, w: box.w, h: box.h };
  });
  const byId = new Map(boxes.map((b) => [b.id, b]));
  const links = (relationsByComponent.get(node.comp.path) || [])
    .filter((r) => byId.has(r.from) && byId.has(r.to))
    .map((r) => ({ source: r.from, target: r.to, kind: r.kind }));

  packBoxes(boxes, links);
  return {
    boxes,
    links,
    w: d3.max(boxes, (b) => b.x + b.w / 2),
    h: d3.max(boxes, (b) => b.y + b.h / 2),
  };
}

/* Place class boxes in rows, related ones adjacent.
 *
 * A force layout is the wrong tool here: most classes in a package have no
 * relations at all, so repulsion just blows the box up with whitespace. Rows
 * stay compact and readable; ordering by connectivity keeps a class next to
 * the ones it points at, so the edges stay short. */
function packBoxes(boxes, links, gap = 18) {
  const index = new Map(boxes.map((b, i) => [b.id, i]));
  const parent = boxes.map((_, i) => i);
  const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
  for (const link of links) {
    const a = index.get(link.source), b = index.get(link.target);
    if (a !== undefined && b !== undefined) parent[find(a)] = find(b);
  }
  const clusters = new Map();
  boxes.forEach((b, i) => {
    const key = find(i);
    if (!clusters.has(key)) clusters.set(key, []);
    clusters.get(key).push(b);
  });
  // Biggest clusters first; isolated classes fall to the end.
  const ordered = [...clusters.values()]
    .sort((a, b) => b.length - a.length || b[0].w - a[0].w)
    .flat();

  // Row width chosen for a roughly landscape block.
  const area = d3.sum(ordered, (b) => (b.w + gap) * (b.h + gap));
  const rowWidth = Math.max(d3.max(ordered, (b) => b.w), Math.sqrt(area * 1.7));

  let x = 0, y = 0, rowHeight = 0;
  for (const box of ordered) {
    if (x > 0 && x + box.w > rowWidth) {
      x = 0;
      y += rowHeight + gap;
      rowHeight = 0;
    }
    box.x = x + box.w / 2;
    box.y = y + box.h / 2;
    x += box.w + gap;
    rowHeight = Math.max(rowHeight, box.h);
  }
}

// Generic rectangular separation, used for class boxes inside a component and
// for the components themselves.
function separateRects(items, iterations, padding) {
  for (let pass = 0; pass < iterations; pass++) {
    let moved = false;
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const overlapX = (a.w + b.w) / 2 + padding - Math.abs(dx);
        const overlapY = (a.h + b.h) / 2 + padding - Math.abs(dy);
        if (overlapX <= 0 || overlapY <= 0) continue;
        if (overlapX < overlapY) {
          const shift = ((dx < 0 ? -1 : 1) * overlapX) / 2;
          a.x -= shift; b.x += shift;
        } else {
          const shift = ((dy < 0 ? -1 : 1) * overlapY) / 2;
          a.y -= shift; b.y += shift;
        }
        moved = true;
      }
    }
    if (!moved) return;
  }
}

// Expanded, a component is sized to hold its class diagram.
function layoutClasses(node) {
  if (node.expanded && node.explosion) {
    node.w = Math.max(node.baseW, node.explosion.w + INNER_PAD * 2);
    node.h = HEAD_H + node.explosion.h + INNER_PAD;
  } else {
    node.w = node.baseW;
    node.h = HEAD_H;
  }
}

// ---- layout ------------------------------------------------------------
const groups = [...new Set(nodes.map((n) => n.comp.group))].sort();
const cellOf = gridCells(groups, 560);

nodes.forEach((n, i) => {
  const cell = cellOf.get(n.comp.group) || { x: 0, y: 0 };
  n.x = cell.x + (i % 5) * 40 - 80;
  n.y = cell.y + (Math.floor(i / 5) % 5) * 40 - 80;
  n.explosion = buildExplosion(n);
  layoutClasses(n);
});

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id((d) => d.id).distance(200).strength(0.3))
  .force("charge", d3.forceManyBody().strength(-1200).distanceMax(1400))
  .force("collide", d3.forceCollide().radius((d) => Math.hypot(d.w, d.h) / 2 + 30).strength(0.95))
  // Group cohesion outweighs link pull, so a group stays a readable block.
  .force("x", d3.forceX((d) => (cellOf.get(d.comp.group) || { x: 0 }).x).strength(0.22))
  .force("y", d3.forceY((d) => (cellOf.get(d.comp.group) || { y: 0 }).y).strength(0.22))
  .stop();
for (let i = 0; i < 300; i++) sim.tick();

// Boxes are rectangles, and expanding one makes it much bigger, so settle the
// arrangement in two passes: separate overlapping components, then separate
// whole groups as blocks. Rectangular separation packs far tighter than the
// circular collision force, and keeps each group's box from swallowing another.
const separateComponents = (iterations, padding) => separateRects(nodes, iterations, padding);

// The group box drawn around a set of components. Separation and rendering
// share this geometry, so the gap the layout leaves is the gap you see.
const HULL = { left: 24, right: 24, top: 34, bottom: 24 };

function blockOf(members) {
  return {
    members,
    x0: d3.min(members, (n) => n.x - n.w / 2) - HULL.left,
    y0: d3.min(members, (n) => n.y - n.h / 2) - HULL.top,
    x1: d3.max(members, (n) => n.x + n.w / 2) + HULL.right,
    y1: d3.max(members, (n) => n.y + n.h / 2) + HULL.bottom,
  };
}

// One block per group, plus each ungrouped component on its own.
function blocks() {
  const byGroup = new Map();
  for (const n of nodes) {
    const key = n.comp.group || ` ${n.id}`;
    if (!byGroup.has(key)) byGroup.set(key, []);
    byGroup.get(key).push(n);
  }
  return [...byGroup.values()].map(blockOf);
}

function separateGroups(iterations, padding) {
  for (let pass = 0; pass < iterations; pass++) {
    const boxes = blocks();
    let moved = false;
    for (let i = 0; i < boxes.length; i++) {
      for (let j = i + 1; j < boxes.length; j++) {
        const a = boxes[i], b = boxes[j];
        const overlapX = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0) + padding;
        const overlapY = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) + padding;
        if (overlapX <= 0 || overlapY <= 0) continue;
        const aCenterX = (a.x0 + a.x1) / 2, bCenterX = (b.x0 + b.x1) / 2;
        const aCenterY = (a.y0 + a.y1) / 2, bCenterY = (b.y0 + b.y1) / 2;
        const shiftAll = (block, dx, dy) => {
          for (const n of block.members) { n.x += dx; n.y += dy; }
        };
        if (overlapX < overlapY) {
          const shift = ((bCenterX < aCenterX ? -1 : 1) * overlapX) / 2;
          shiftAll(a, -shift, 0); shiftAll(b, shift, 0);
        } else {
          const shift = ((bCenterY < aCenterY ? -1 : 1) * overlapY) / 2;
          shiftAll(a, 0, -shift); shiftAll(b, 0, shift);
        }
        moved = true;
      }
    }
    if (!moved) return;
  }
}

function relayout() {
  for (let round = 0; round < 4; round++) {
    separateComponents(60, 26);
    separateGroups(40, 22);
  }
  separateGroups(40, 22);   // groups win the last word, so no box overlaps
}
relayout();

// ---- render ------------------------------------------------------------
const svg = d3.select("#canvas");
const view = svg.append("g");

svg.append("defs").html(
  arrowMarker("arrow-dep", "var(--edge)") +
  arrowMarker("arrow-dep-added", "var(--added-stroke)", 7) +
  arrowMarker("arrow-dep-removed", "var(--removed-stroke)", 7) +
  arrowMarker("arrow-hollow", "var(--edge)", 8, "hollow") +
  arrowMarker("arrow-open", "var(--edge)", 7)
);

// Group boxes are draggable: moving one moves every component inside it.
const hullLayer = view.append("g");
const hull = hullLayer.selectAll("g").data(groups.filter(Boolean)).join("g");
hull.append("rect")
  .attr("class", "group-box")
  .attr("rx", 14)
  .attr("fill", "#afb8c11a")
  .attr("stroke", "var(--context-stroke)")
  .attr("stroke-dasharray", "2 4")
  .call(d3.drag().on("drag", function (event, group) {
    for (const n of nodes) {
      if (n.comp.group !== group) continue;
      n.x += event.dx;
      n.y += event.dy;
    }
    positionNodes();
    updateEdges();
    updateHulls();
  }));
hull.append("text").attr("font-size", 12).attr("fill", "var(--muted)").text((g) => g);
hull.append("title").text((g) => `${g} — drag to move the whole group`);

function updateHulls() {
  hull.each(function (group) {
    const members = nodes.filter((n) => n.comp.group === group);
    if (!members.length) return;
    const box = blockOf(members);
    const sel = d3.select(this);
    sel.select("rect")
      .attr("x", box.x0).attr("y", box.y0)
      .attr("width", box.x1 - box.x0).attr("height", box.y1 - box.y0);
    sel.select("text").attr("x", box.x0 + 12).attr("y", box.y0 + 18);
  });
}

const edge = view.append("g")
  .selectAll("path")
  .data(links)
  .join("path")
  .attr("fill", "none")
  .attr("stroke", (d) => (d.change === "unchanged" ? "var(--edge)" : colorsFor(d.change, DIFF).stroke))
  .attr("stroke-width", (d) => (d.change !== "unchanged" ? 1.9 : 0.9 + Math.min(1.3, Math.log2(d.weight) / 2)))
  .attr("stroke-dasharray", (d) => (d.change === "removed" ? "3 3" : "6 4"))
  .attr("opacity", (d) => (DIFF && d.change === "unchanged" ? 0.4 : 0.85))
  .attr("marker-end", (d) =>
    d.change === "added" ? "url(#arrow-dep-added)"
    : d.change === "removed" ? "url(#arrow-dep-removed)"
    : "url(#arrow-dep)");
edge.append("title").text((d) => {
  const from = byId.get(typeof d.source === "object" ? d.source.id : d.source);
  const to = byId.get(typeof d.target === "object" ? d.target.id : d.target);
  const suffix = d.change !== "unchanged" ? `, ${d.change}` : "";
  return `${from.comp.name} ⟶ ${to.comp.name} (${d.weight} importing file${d.weight === 1 ? "" : "s"}${suffix})`;
});

const node = view.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .call((sel) => draggableNodes(sel, { onMove: () => { updateEdges(); updateHulls(); } }));

function positionNodes() {
  node.attr("transform", nodeTransform);
}

function classTitle(cls) {
  const members = cls.members.slice(0, 24)
    .map((m) => `  ${m.visibility}${m.name}${m.isMethod ? "()" : ""}${mark(m.change)}`)
    .join("\n");
  const more = cls.members.length > 24 ? `\n  … ${cls.members.length - 24} more` : "";
  const stereotype = cls.annotation ? `«${cls.annotation}» ` : "";
  return `${stereotype}${cls.qualified}${members ? "\n" + members + more : ""}`;
}

// Each node's DOM is built once: chrome (box, title, toggle) plus a hidden
// explosion holding its class diagram. Expanding flips visibility and resizes
// the box — it never rebuilds, so toggling stays instant however big the
// component is.
function drawNode(sel) {
  sel.each(function (d) {
    const g = d3.select(this);
    g.selectAll("*").remove();
    const colors = d.external ? vizzy.PALETTE.external : colorsFor(d.comp.change, DIFF);
    const ink = d.external ? "var(--muted)" : inkFor(d.comp.change, DIFF);

    g.append("title").text(d.external ? d.comp.name : d.comp.path || "(repo root)");
    g.append("rect")
      .attr("class", "comp-box")
      .attr("rx", 8)
      .attr("fill", colors.fill)
      .attr("stroke", colors.stroke)
      .attr("stroke-width", d.comp.change === "unchanged" && !d.external ? 1.3 : 2)
      .attr("stroke-dasharray", d.comp.change === "removed" || d.external ? "6 4" : null);

    if (!d.external) {
      for (const dy of [6, 13]) {                       // UML component tabs
        g.append("rect").attr("class", "comp-tab")
          .attr("y", dy).attr("width", 14).attr("height", 5)
          .attr("fill", "var(--panel)").attr("stroke", colors.stroke).attr("stroke-width", 1);
      }
    }

    let y = d.external ? 19 : 15;
    if (!d.external) {
      g.append("text").attr("class", "comp-centered").attr("y", y)
        .attr("text-anchor", "middle").attr("font-size", 10)
        .attr("fill", "var(--muted)").text("«component»");
      y += 16;
    }
    g.append("text").attr("class", "comp-centered").attr("y", y)
      .attr("text-anchor", "middle").attr("font-size", 12.5)
      .attr("font-weight", 700).attr("fill", ink)
      .text(d.comp.name + mark(d.comp.change));
    if (d.sub) {
      y += 15;
      g.append("text").attr("class", "comp-centered").attr("y", y)
        .attr("text-anchor", "middle").attr("font-size", 10)
        .attr("fill", "var(--muted)").text(d.sub);
    }

    if (d.explosion) {
      const toggle = g.append("g").attr("class", "comp-toggle")
        .attr("transform", `translate(14,${HEAD_H / 2 - 2})`)
        .on("click", (event) => {
          event.stopPropagation();
          setExpanded(d, !d.expanded, { reveal: true });
        });
      toggle.append("title").text(`show / hide ${d.classes.length} classes`);
      toggle.append("circle").attr("r", 8).attr("fill", "var(--panel)").attr("stroke", colors.stroke);
      toggle.append("text").attr("class", "toggle-sign").attr("text-anchor", "middle").attr("y", 4)
        .attr("font-size", 12).attr("fill", ink).text("+");
      buildExplosionDom(g, d);
    }
  });
  sel.each((d) => sizeNode(d));
}

/* The class diagram inside a component: edges first, boxes on top. */
function buildExplosionDom(g, d) {
  const layer = g.append("g")
    .attr("class", "comp-explosion")
    .attr("display", "none")
    .attr("transform", `translate(${INNER_PAD},${HEAD_H})`);

  const at = new Map(d.explosion.boxes.map((b) => [b.id, b]));
  const endpoint = (l, key) => at.get(typeof l[key] === "object" ? l[key].id : l[key]);

  layer.append("g").selectAll("path")
    .data(d.explosion.links)
    .join("path")
    .attr("fill", "none")
    .attr("stroke", "var(--edge)")
    .attr("stroke-width", 1.1)
    .attr("opacity", (l) => (l.kind === "dependency" ? 0.5 : 0.8))
    .attr("stroke-dasharray", (l) => relationStyle(l.kind).dash)
    .attr("marker-end", (l) => `url(#arrow-${relationStyle(l.kind).marker})`)
    .attr("d", (l) => {
      const a = endpoint(l, "source"), b = endpoint(l, "target");
      const from = edgePoint(a, b), to = edgePoint(b, a);
      return `M${from.x},${from.y}L${to.x},${to.y}`;
    })
    .append("title")
    .text((l) => `${endpoint(l, "source").cls.name} ${l.kind} ${endpoint(l, "target").cls.name}`);

  layer.append("g").selectAll("g")
    .data(d.explosion.boxes)
    .join("g")
    .attr("transform", (b) => `translate(${b.x - b.w / 2},${b.y - b.h / 2})`)
    .each(function (b) {
      drawClassBox(d3.select(this), b.cls, b.box, { diff: DIFF });
    });
}

/* Resize the box and re-centre its chrome — the only work a toggle does. */
function sizeNode(d) {
  const g = node.filter((n) => n === d);
  g.select("rect.comp-box").attr("width", d.w).attr("height", d.h);
  g.selectAll("rect.comp-tab").attr("x", d.w - 22);
  g.selectAll("text.comp-centered").attr("x", d.w / 2);
  g.select("text.toggle-sign").text(d.expanded ? "−" : "+");
  g.select("g.comp-explosion").attr("display", d.expanded ? null : "none");
}

function refresh(changed) {
  for (const d of changed) {
    layoutClasses(d);
    sizeNode(d);
  }
  relayout();
  positionNodes();
  updateEdges();
  updateHulls();
  syncToggleButton();
}

function setExpanded(d, expanded, { reveal = false } = {}) {
  d.expanded = expanded && !!d.explosion;
  refresh([d]);
  // Opening should put the thing you opened in front of you.
  if (reveal && d.expanded) viewport.focus({ x: d.x, y: d.y, w: d.w, h: d.h });
}

function updateEdges() {
  edge.attr("d", linkPath);
}

drawNode(node);
positionNodes();
updateEdges();
updateHulls();

// ---- controls ------------------------------------------------------------
const expandable = nodes.filter((n) => n.explosion);
const toggleButton = document.getElementById("toggle-classes");

function syncToggleButton() {
  const open = expandable.filter((n) => n.expanded).length;
  toggleButton.setAttribute("aria-pressed", String(open > 0));
  toggleButton.textContent = open > 0 ? `Hide classes (${open})` : "Show classes";
}

if (!expandable.length) {
  toggleButton.disabled = true;
  toggleButton.title = "no class detail in this diagram (generated with --no-classes)";
} else {
  toggleButton.addEventListener("click", () => {
    const expand = !expandable.some((n) => n.expanded);
    for (const n of expandable) n.expanded = expand;
    refresh(expandable);
  });
}
syncToggleButton();

// Handlers registered above only run after load, so binding here is safe.
const viewport = vizzy.attachViewport(svg, view, { fitButton: "fit" });

const matches = (n, query) =>
  n.comp.name.toLowerCase().includes(query) ||
  n.comp.path.toLowerCase().includes(query) ||
  n.comp.group.toLowerCase().includes(query) ||
  n.classes.some((c) => c.name.toLowerCase().includes(query));
vizzy.attachFilter("search", { nodes: node, edges: edge, matches });

vizzy.setHeader(
  `${graph.stats.components} components · ${links.length} dependencies` +
    (graph.stats.classes ? ` · ${graph.stats.classes} classes` : ""),
  DIFF
);
</script>
</body>
</html>
