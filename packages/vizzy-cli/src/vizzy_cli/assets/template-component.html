<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #656d76;
    --box-fill: #eef4ff;
    --box-stroke: #4969b0;
    --hull-fill: #afb8c11a;
    --hull-stroke: #afb8c1;
    --added-fill: #e6ffec;   --added-stroke: #1a7f37;
    --removed-fill: #ffebe9; --removed-stroke: #cf222e;
    --modified-fill: #fff8c5; --modified-stroke: #9a6700;
    --edge: #57606a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid #d0d7de; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; }
  header .stats { color: var(--muted); font-size: 12.5px; }
  header input { padding: 5px 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 13px; width: 220px; }
  header button { padding: 5px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: var(--panel); font-size: 13px; cursor: pointer; }
  header button:hover { background: var(--bg); }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); align-items: center; }
  .legend[hidden] { display: none; }
  .legend .chip { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -2px; border: 1.5px solid; }
  #canvas { flex: 1; min-height: 0; cursor: grab; }
  #canvas:active { cursor: grabbing; }
  .hint { position: fixed; right: 14px; bottom: 10px; font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 3px 8px; border-radius: 6px; }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; user-select: none; }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span class="stats" id="stats"></span>
  <input id="search" type="search" placeholder="filter components / groups…">
  <button id="fit">Fit</button>
  <span class="legend" id="legend" hidden>
    <span><span class="chip" style="background:var(--added-fill);border-color:var(--added-stroke)"></span>added</span>
    <span><span class="chip" style="background:var(--removed-fill);border-color:var(--removed-stroke)"></span>removed</span>
    <span><span class="chip" style="background:var(--modified-fill);border-color:var(--modified-stroke)"></span>modified</span>
  </span>
</header>
<svg id="canvas"></svg>
<div class="hint">scroll to zoom · drag background to pan · drag components to arrange</div>

<script>__D3_JS__</script>
<script id="graph-data" type="application/json">__GRAPH_JSON__</script>
<script id="config-data" type="application/json">__CONFIG_JSON__</script>
<script>
"use strict";
const graph = JSON.parse(document.getElementById("graph-data").textContent);
const config = JSON.parse(document.getElementById("config-data").textContent);

// ---- geometry ---------------------------------------------------------
const CHAR_W = 7.25, PAD_X = 14;

const MARK = { added: " ✚", removed: " ✖", modified: " ✱", unchanged: "" };
const PALETTE = {
  added:    { fill: "var(--added-fill)",    stroke: "var(--added-stroke)" },
  removed:  { fill: "var(--removed-fill)",  stroke: "var(--removed-stroke)" },
  modified: { fill: "var(--modified-fill)", stroke: "var(--modified-stroke)" },
  unchanged:{ fill: "var(--box-fill)",      stroke: "var(--box-stroke)" },
  external: { fill: "var(--panel)",         stroke: "var(--muted)" },
};

function statsLine(c) {
  const parts = [];
  if (c.classes) parts.push(`${c.classes} class${c.classes === 1 ? "" : "es"}`);
  else parts.push(`${c.files} file${c.files === 1 ? "" : "s"}`);
  if (c.langs.length) parts.push(c.langs.map((l) => (l === "typescript" ? "ts" : l === "python" ? "py" : l)).join("/"));
  return parts.join(" · ");
}

function buildNode(c) {
  const header = c.name + (MARK[c.change] || "");
  const sub = statsLine(c);
  const widest = Math.max(header.length + 2, sub.length, "«component»".length);
  const w = Math.min(340, widest * CHAR_W + PAD_X * 2);
  return { id: c.path, comp: c, sub, w, h: 58, external: false };
}

const nodes = graph.components.map(buildNode);
const byId = new Map(nodes.map((n) => [n.id, n]));

// External packages become small stub nodes (deduped by name).
if (config.includeExternals) {
  for (const e of graph.edges) {
    if (!e.external) continue;
    const id = `ext:${e.to}`;
    if (!byId.has(id)) {
      const w = Math.max(e.to.length + 4, 10) * CHAR_W + PAD_X * 2;
      const stub = { id, comp: { name: e.to, path: "", group: "", change: "unchanged" }, sub: "", w, h: 30, external: true };
      nodes.push(stub);
      byId.set(id, stub);
    }
  }
}

const links = graph.edges
  .filter((e) => (e.external ? config.includeExternals : true))
  .map((e) => ({ source: e.from, target: e.external ? `ext:${e.to}` : e.to, weight: e.weight, change: e.change }))
  .filter((l) => byId.has(l.source) && byId.has(l.target));

// ---- layout: force simulation, ticked synchronously -------------------
// Weak per-group gravity keeps each parent directory's components together.
const groups = [...new Set(nodes.map((n) => n.comp.group))].sort();
const grid = Math.ceil(Math.sqrt(groups.length));
const CELL = 560;
const cellOf = new Map(groups.map((g, i) => [g, {
  x: (i % grid - (grid - 1) / 2) * CELL,
  y: (Math.floor(i / grid) - (grid - 1) / 2) * CELL,
}]));

nodes.forEach((n, i) => {
  const c = cellOf.get(n.comp.group) || { x: 0, y: 0 };
  n.x = c.x + (i % 5) * 40 - 80;
  n.y = c.y + (Math.floor(i / 5) % 5) * 40 - 80;
});

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id((d) => d.id).distance(200).strength(0.35))
  .force("charge", d3.forceManyBody().strength(-1400).distanceMax(1400))
  .force("collide", d3.forceCollide().radius((d) => Math.hypot(d.w, d.h) / 2 + 30).strength(0.95))
  .force("x", d3.forceX((d) => (cellOf.get(d.comp.group) || { x: 0 }).x).strength(0.08))
  .force("y", d3.forceY((d) => (cellOf.get(d.comp.group) || { y: 0 }).y).strength(0.08))
  .stop();
for (let i = 0; i < 300; i++) sim.tick();

// ---- render ------------------------------------------------------------
const svg = d3.select("#canvas");
const view = svg.append("g");

svg.append("defs").html(`
  <marker id="arrow-dep" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11" fill="none" stroke="var(--edge)" stroke-width="1.6"/>
  </marker>
  <marker id="arrow-dep-added" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11" fill="none" stroke="var(--added-stroke)" stroke-width="1.8"/>
  </marker>
  <marker id="arrow-dep-removed" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11" fill="none" stroke="var(--removed-stroke)" stroke-width="1.8"/>
  </marker>`);

// Group hulls: a rounded rect behind each parent directory's components.
const hullLayer = view.append("g");
const hullData = groups.filter((g) => g);
const hull = hullLayer.selectAll("g").data(hullData).join("g");
hull.append("rect")
  .attr("rx", 14)
  .attr("fill", "var(--hull-fill)")
  .attr("stroke", "var(--hull-stroke)")
  .attr("stroke-dasharray", "2 4");
hull.append("text")
  .attr("font-size", 12).attr("fill", "var(--muted)")
  .text((g) => g);

function updateHulls() {
  hull.each(function (g) {
    const members = nodes.filter((n) => n.comp.group === g);
    if (!members.length) return;
    const x0 = d3.min(members, (n) => n.x - n.w / 2) - 24;
    const y0 = d3.min(members, (n) => n.y - n.h / 2) - 34;
    const x1 = d3.max(members, (n) => n.x + n.w / 2) + 24;
    const y1 = d3.max(members, (n) => n.y + n.h / 2) + 24;
    const sel = d3.select(this);
    sel.select("rect").attr("x", x0).attr("y", y0).attr("width", x1 - x0).attr("height", y1 - y0);
    sel.select("text").attr("x", x0 + 12).attr("y", y0 + 18);
  });
}

// Edge endpoint on the boundary of a node's rectangle, toward `other`.
function edgePoint(node, other) {
  const dx = other.x - node.x, dy = other.y - node.y;
  if (dx === 0 && dy === 0) return { x: node.x, y: node.y };
  const sx = (node.w / 2) / Math.abs(dx || 1e-9), sy = (node.h / 2) / Math.abs(dy || 1e-9);
  const s = Math.min(sx, sy);
  return { x: node.x + dx * s, y: node.y + dy * s };
}

function edgeColor(d) {
  if (d.change === "added") return "var(--added-stroke)";
  if (d.change === "removed") return "var(--removed-stroke)";
  return "var(--edge)";
}

const edge = view.append("g")
  .selectAll("path")
  .data(links)
  .join("path")
  .attr("fill", "none")
  .attr("stroke", edgeColor)
  .attr("stroke-width", (d) => (d.change !== "unchanged" ? 2.6 : 1.2 + Math.min(2.4, Math.log2(d.weight))))
  .attr("stroke-dasharray", (d) => (d.change === "removed" ? "3 3" : "7 5"))
  .attr("opacity", (d) => (graph.stats.diff && d.change === "unchanged" ? 0.45 : 1))
  .attr("marker-end", (d) =>
    d.change === "added" ? "url(#arrow-dep-added)" : d.change === "removed" ? "url(#arrow-dep-removed)" : "url(#arrow-dep)");
edge.append("title").text((d) =>
  `${byId.get(typeof d.source === "object" ? d.source.id : d.source).comp.name} ⟶ ` +
  `${byId.get(typeof d.target === "object" ? d.target.id : d.target).comp.name}` +
  ` (${d.weight} importing file${d.weight === 1 ? "" : "s"}${d.change !== "unchanged" ? ", " + d.change : ""})`);

const node = view.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .call(drawComponent)
  .call(d3.drag()
    .on("drag", function (event, d) {
      d.x += event.dx; d.y += event.dy;
      d3.select(this).attr("transform", `translate(${d.x - d.w / 2},${d.y - d.h / 2})`);
      updateEdges();
      updateHulls();
    }));

function drawComponent(sel) {
  sel.attr("transform", (d) => `translate(${d.x - d.w / 2},${d.y - d.h / 2})`);
  sel.append("title").text((d) => (d.external ? d.comp.name : d.comp.path || "(repo root)"));

  sel.append("rect")
    .attr("width", (d) => d.w).attr("height", (d) => d.h)
    .attr("rx", 8)
    .attr("fill", (d) => (d.external ? PALETTE.external.fill : PALETTE[d.comp.change].fill))
    .attr("stroke", (d) => (d.external ? PALETTE.external.stroke : PALETTE[d.comp.change].stroke))
    .attr("stroke-width", (d) => (d.comp.change === "unchanged" && !d.external ? 1.4 : 2.2))
    .attr("stroke-dasharray", (d) => (d.comp.change === "removed" || d.external ? "6 4" : null));

  // The UML component "tabs" glyph in the top-right corner.
  sel.filter((d) => !d.external).each(function (d) {
    const g = d3.select(this);
    const gx = d.w - 22;
    for (const dy of [6, 13]) {
      g.append("rect").attr("x", gx).attr("y", dy).attr("width", 14).attr("height", 5)
        .attr("fill", "var(--panel)").attr("stroke", PALETTE[d.comp.change].stroke).attr("stroke-width", 1);
    }
  });

  sel.each(function (d) {
    const g = d3.select(this);
    let y = d.external ? 19 : 15;
    if (!d.external) {
      g.append("text").attr("x", d.w / 2).attr("y", y).attr("text-anchor", "middle")
        .attr("font-size", 10).attr("fill", "var(--muted)")
        .text("«component»");
      y += 16;
    }
    g.append("text").attr("x", d.w / 2).attr("y", y).attr("text-anchor", "middle")
      .attr("font-size", 12.5).attr("font-weight", 700)
      .attr("fill", d.external ? "var(--muted)" : PALETTE[d.comp.change].stroke)
      .text(d.comp.name + (MARK[d.comp.change] || ""));
    if (d.sub) {
      y += 15;
      g.append("text").attr("x", d.w / 2).attr("y", y).attr("text-anchor", "middle")
        .attr("font-size", 10).attr("fill", "var(--muted)")
        .text(d.sub);
    }
  });
}

function updateEdges() {
  edge.attr("d", (d) => {
    const a = edgePoint(d.source, d.target);
    const b = edgePoint(d.target, d.source);
    return `M${a.x},${a.y}L${b.x},${b.y}`;
  });
}
updateEdges();
updateHulls();

// ---- zoom / pan / fit ----------------------------------------------------
// The viewport survives reloads (sessionStorage), so live-reload edits and
// F5 don't lose your place; "Fit" always recomputes.
const VIEW_KEY = `vizzy-view:${location.pathname}:${document.title}`;
const zoom = d3.zoom()
  .scaleExtent([0.04, 5])
  .on("zoom", (e) => view.attr("transform", e.transform))
  .on("end", (e) => {
    const { k, x, y } = e.transform;
    try { sessionStorage.setItem(VIEW_KEY, JSON.stringify({ k, x, y })); } catch {}
  });
svg.call(zoom);

function fit() {
  const b = view.node().getBBox();
  const { width, height } = svg.node().getBoundingClientRect();
  if (!b.width || !b.height) return;
  const k = Math.min(width / (b.width + 80), height / (b.height + 80), 1.5);
  const tx = width / 2 - k * (b.x + b.width / 2);
  const ty = height / 2 - k * (b.y + b.height / 2);
  svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}
document.getElementById("fit").addEventListener("click", fit);

const savedView = (() => {
  try { return JSON.parse(sessionStorage.getItem(VIEW_KEY)); } catch { return null; }
})();
if (savedView && [savedView.k, savedView.x, savedView.y].every(Number.isFinite)) {
  svg.call(zoom.transform, d3.zoomIdentity.translate(savedView.x, savedView.y).scale(savedView.k));
} else {
  requestAnimationFrame(fit);
}

// ---- search ----------------------------------------------------------------
function matches(n, q) {
  return n.comp.name.toLowerCase().includes(q)
    || n.comp.path.toLowerCase().includes(q)
    || n.comp.group.toLowerCase().includes(q);
}
document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  node.attr("opacity", (d) => (!q || matches(d, q) ? 1 : 0.12));
  edge.attr("opacity", (d) => (!q || matches(d.source, q) || matches(d.target, q) ? 1 : 0.06));
});

// ---- header -----------------------------------------------------------------
document.getElementById("stats").textContent =
  `${graph.stats.components} components · ${links.length} dependencies`;
if (graph.stats.diff) document.getElementById("legend").hidden = false;
</script>
</body>
</html>
