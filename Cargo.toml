[workspace]
resolver = "2"
members = ["crates/vizzle-core", "crates/vizzle-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/stiproot/vizzy"

[workspace.dependencies]
anyhow = "1"
