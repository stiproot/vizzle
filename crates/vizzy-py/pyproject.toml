[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "vizzy-core"
description = "Rust core for vizzy: parse code into Mermaid class diagrams"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"

[tool.maturin]
module-name = "vizzy_core"
manifest-path = "Cargo.toml"
