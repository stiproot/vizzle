[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "vizzle-core"
description = "Rust core for vizzle: parse code into Mermaid class diagrams"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"

[tool.maturin]
module-name = "vizzle_core"
manifest-path = "Cargo.toml"
