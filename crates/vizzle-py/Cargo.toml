[package]
name = "vizzle-py"
description = "Python bindings for vizzle-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Built as `vizzle_cli._core`: maturin requires the extension to live inside a
# Python package, and nothing outside the CLI imports it (docs/distribution.md §4).
[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
anyhow = { workspace = true }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
vizzle-core = { path = "../vizzle-core" }
