# Formatting and linting, run on every commit.
# Install with: uv run pre-commit install

# Vendored (d3) and generated (examples) files are not ours to reformat.
exclude: '^(packages/vizzle-cli/src/vizzle_cli/assets/d3\.|examples/)'

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        # pyo3's build script needs an absolute interpreter path; hooks run from the repo root.
        entry: bash -c 'PYO3_PYTHON="$(pwd)/.venv/bin/python3" exec cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
